<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hike Exp - Dashboard Soci</title>
    <link rel="icon" type="image/png" sizes="192x192" href="LOGO.png">
    <link rel="apple-touch-icon" sizes="180x180" href="LOGO.png">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        :root { --primary: #2ecc71; --primary-dark: #27ae60; --dark: #2c3e50; --light: #f8f9fa; --border: #e2e8f0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f1f5f9; color: var(--dark); padding: 15px; }
        
        .container { 
            max-width: 500px; margin: 0 auto; background: white; padding: 20px; 
            border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        @media (min-width: 768px) {
            body { padding: 30px 15px; }
            .container { max-width: 900px; padding: 30px; }
            .search-box-grid, .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        }

        h2 { text-align: center; margin-bottom: 20px; font-size: 22px; color: var(--dark); border-bottom: 3px solid var(--primary); padding-bottom: 10px; }
        .logo-login { display: block; margin: 0 auto 20px auto; max-width: 150px; mix-blend-mode: multiply; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
        input[type="text"], input[type="password"], input[type="number"], input[type="date"], input[type="time"], input[type="email"], select, textarea {
            width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; outline: none; transition: 0.2s;
        }
        button { width: 100%; padding: 14px; background: var(--primary); border: none; color: white; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        button:hover { background: var(--primary-dark); }
        button.secondary { background: #94a3b8; margin-top: 10px; }
        
        .hidden { display: none !important; }
        .search-box, .form-box { background: var(--light); padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid var(--border); }
        
        .tour-list { max-height: 450px; overflow-y: auto; margin-bottom: 15px; border: 1px solid var(--border); border-radius: 8px; }
        .tour-item { padding: 12px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 14px; }
        .tour-item:hover { background: #e8f5e9; }
        .tour-item .title { font-weight: bold; color: #1e293b; margin-bottom: 3px; }
        .tour-item .info { color: #64748b; font-size: 12px; }
        
        .counter-container { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 10px 0; }
        .btn-counter { width: 50px; height: 50px; border-radius: 50%; font-size: 24px; background: #e2e8f0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .status-badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; margin-top: 5px; }
        .badge-dispo { background: #dcfce7; color: #166534; } .badge-full { background: #fee2e2; color: #991b1b; }
        
        .prenotazione-item { background: #f8fafc; padding: 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; font-size: 14px; }
        .badge-bici { background: #e0f2fe; color: #0369a1; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        
        .btn-yellow { background: #eab308; color: white; margin-bottom: 15px;}
        .btn-blue { background: #3b82f6; margin-top: 15px; }
        .btn-storno { background: #f97316; font-size: 12px; padding: 8px; border-radius:6px; font-weight:bold; color:white; border:none; cursor:pointer;}
        .btn-ok { background: #10b981; font-size: 12px; padding: 8px; border-radius:6px; font-weight:bold; color:white; border:none;}

        #toast-container { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; }
        .toast { background: #1e293b; color: white; padding: 14px 20px; border-radius: 10px; font-size: 14px; font-weight: 600; text-align: center; opacity: 0; animation: slideIn 0.3s forwards, fadeOut 0.4s forwards 3s; }
        .toast.success { background: #10b981; border-left: 6px solid #047857; } .toast.error { background: #ef4444; border-left: 6px solid #b91c1c; }
        @keyframes slideIn { to { opacity: 1; transform: translateY(0); } } @keyframes fadeOut { to { opacity: 0; transform: translateY(20px); } }
    </style>
</head>
<body>

<div id="toast-container"></div>

<div class="container">
    <h2>Hike Exp - Dashboard Soci</h2>

    <div id="sectionLogin">
        <img src="LOGO.png" class="logo-login" alt="Logo">
        <div class="form-group"><label>Password Admin:</label><input type="password" id="password" placeholder="Password"></div>
        <button onclick="caricaTuttiITour()">Accedi e Carica</button>
    </div>

    <!-- SEZIONE DASHBOARD PRINCIPALE -->
    <div id="sectionDashboard" class="hidden">
        <div style="display: flex; gap: 10px; margin-bottom:5px;">
            <button class="btn-yellow" style="flex:1;" onclick="apriPannelloNoleggi()">🚲 Gestione Noleggi</button>
            <button class="btn-yellow" style="flex:1; background: #8b5cf6;" onclick="apriCalendario()">📅 Calendario</button>
        </div>
        <button class="btn-yellow" style="width:100%; background: #ec4899;" onclick="apriTourPrivati()">🚐 Gestione Tour Privati</button>

        <div class="search-box">
            <div class="search-box-grid">
                <div class="form-group"><label>🔍 Nome Tour:</label><input type="text" id="searchNome" oninput="filtraI_Tour()"></div>
                <div class="form-group"><label>📅 Data:</label><input type="text" id="searchData" oninput="filtraI_Tour()"></div>
            </div>
        </div>
        <label>Seleziona il tour per aggiungere prenotazioni:</label>
        <div id="loadingList" class="loading hidden">Caricamento...</div>
        <div class="tour-list" id="listaContenitore"></div>
        <button class="secondary" onclick="disconnetti()">Esci</button>
    </div>

    <!-- SEZIONE TOUR PRIVATI -->
    <div id="sectionTourPrivati" class="hidden">
        <h3 style="text-align: center; margin-bottom: 15px; color: #1e293b;">🚐 Gestione Tour Privati</h3>
        
        <div class="form-box" style="border: 1px solid #fbcfe8; background: #fdf2f8;">
            <h4 style="color: #be185d; margin-bottom: 10px;">Crea Nuovo Tour Privato / Personalizzato</h4>
            <div class="form-grid-2">
                <div class="form-group"><label>Nome Gruppo/Referente:</label><input type="text" id="priv-nome" placeholder="Es. Gruppo Rossi"></div>
                <div class="form-group"><label>Data del Tour:</label><input type="date" id="priv-data"></div>
            </div>
            <div class="form-grid-2">
                <div class="form-group"><label>Numero di Bici:</label><input type="number" id="priv-bici" value="1" min="1"></div>
                <div class="form-group"><label>Prezzo Pattuito (€):</label><input type="number" id="priv-prezzo" placeholder="Es. 350"></div>
            </div>
            <button onclick="salvaTourPrivato()" style="background: #ec4899; margin-bottom: 0;">Salva e Storna Disponibilità nei Tour</button>
        </div>

        <div style="margin-top: 25px;">
            <div id="loadingPrivati" class="loading hidden">Recupero dati...</div>
            <div id="lista-tour-privati"></div>
        </div>
        <button class="secondary" onclick="tornaAiTourDaPrivati()" style="margin-top: 25px;">⬅ Torna ai Tour</button>
    </div>

    <!-- SEZIONE MODIFICA (Inserimento Prenotati) -->
    <div id="sectionModifica" class="hidden">
        <div style="background: #e0f2fe; padding: 12px; border-radius: 8px; margin-bottom: 15px; border-left: 5px solid #0284c7;">
            <div id="editNomeTour" style="font-weight: bold; font-size: 16px; margin-bottom: 4px; color: #0369a1;">-</div>
            <div id="editDettagli" style="font-size: 13px; color: #0f172a;">-</div>
        </div>

        <h3 style="font-size: 16px; margin-bottom: 10px; text-align: center;">Nuova Prenotazione</h3>
        <div class="form-box">
            <div class="form-grid-2">
                <div class="form-group"><label>👤 Nominativo:</label><input type="text" id="nuovoNome"></div>
                <div class="form-group"><label>📞 Telefono:</label><input type="text" id="nuovoTelefono"></div>
            </div>
            <div class="form-group">
                <label>🚲 Numero Bici:</label>
                <div class="counter-container">
                    <div class="btn-counter" onclick="cambiaPostiNuovi(-1)">-</div>
                    <div id="displayNuoviPosti" style="font-size:24px; font-weight:bold;">1</div>
                    <div class="btn-counter" onclick="cambiaPostiNuovi(1)">+</div>
                </div>
            </div>
            <!-- CHECKBOX EBIKE PROPRIA -->
            <div class="form-group">
                <label style="display:flex; align-items:center; gap:8px; cursor:pointer; background:#fef08a; padding:10px; border-radius:8px; color:#854d0e;">
                    <input type="checkbox" id="chk-bici-propria" style="width:20px; height:20px; margin:0;">
                    Cliente con E-Bike Propria (Viene aggiunto alla lista ma non scala disponibilità)
                </label>
            </div>
        </div>
        <button onclick="salvaNuovaPrenotazione()" id="btnSalvaPrenotazione">Salva Prenotazione</button>
        <button class="secondary" onclick="tornaAllaLista()">Annulla</button>

        <button class="btn-blue" onclick="caricaListaPrenotati()">📋 Mostra Lista Prenotati</button>
        <button style="background: #dc2626; margin-top: 15px;" onclick="eliminaTourIntero()">🗑️ Elimina Tour Definitivamente</button>

        <div id="listaPrenotatiContainer" class="hidden" style="margin-top: 20px; border-top: 2px dashed var(--border); padding-top: 15px;">
            <div id="loadingPrenotati" class="loading hidden">Recupero in corso...</div>
            <div id="listaPrenotatiContent"></div>
        </div>
    </div>

    <!-- SEZIONE NOLEGGI (rimasta standard, come originale) -->
    <div id="sectionNoleggi" class="hidden">
        <h3 style="text-align: center; margin-bottom: 15px;">Gestione Noleggi</h3>
        <div class="form-box" style="border: 1px solid #fcd34d; background: #fffbeb;">
            <form id="form-noleggio-manuale" onsubmit="inviaNoleggioManuale(event)">
                <div class="form-grid-2">
                    <div class="form-group"><label>Data Inizio:</label><input type="date" id="man-data" required></div>
                    <div class="form-group"><label>Ore Ritiro:</label><input type="time" id="man-orario" value="09:00" required></div>
                </div>
                <div class="form-grid-2">
                    <div class="form-group"><label>Nome:</label><input type="text" id="man-nome" required></div>
                    <div class="form-group"><label>Tel:</label><input type="text" id="man-telefono" required></div>
                </div>
                <div class="form-grid-2">
                    <div class="form-group"><label>Email:</label><input type="email" id="man-email"></div>
                    <div class="form-group"><label>Offerta / Tipo:</label><select id="man-offerta" required></select></div>
                </div>
                <div class="form-grid-2">
                    <div class="form-group"><label>Durata (Giorni):</label><input type="number" id="man-durata" value="1" min="1" required></div>
                    <div class="form-group"><label>Bici:</label><input type="number" id="man-bici" value="1" required></div>
                </div>
                <div class="form-group"><label>Altezze:</label><input type="text" id="man-altezze" required></div>
                <button type="submit" id="btnRegistraNoleggio" class="btn-yellow" style="margin-bottom: 0;">Registra Noleggio</button>
            </form>
        </div>
        <div id="lista-noleggi-pendenti" style="margin-top: 25px;"></div>
        <button class="secondary" onclick="tornaAiTourDaNoleggi()" style="margin-top: 25px;">⬅ Torna ai Tour</button>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwz7SwD5wSzhO-Mtc_17gOj1ewHum5aoQ63yxjfnV5rCnjjNHyMYiYFowwX3u1tTEQ-/exec";
    let tuttiITour = []; let tourSelezionato = null; let datiNoleggiGlobali = {}; 

    function mostraNotifica(messaggio, tipo = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div'); toast.className = `toast ${tipo}`; toast.innerHTML = messaggio;
        container.appendChild(toast); setTimeout(() => { toast.remove(); }, 3500);
    }

    window.onload = function() {
        if (localStorage.getItem("hike_admin_pass")) {
            document.getElementById("password").value = localStorage.getItem("hike_admin_pass");
            caricaTuttiITour();
        }
    };

    function caricaTuttiITour() {
        const pass = document.getElementById("password").value;
        if (!pass) return alert("Inserisci la password!");
        document.getElementById("loadingList").classList.remove("hidden");
        
        fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "get_all_tours", password: pass }) })
        .then(res => res.json()).then(data => {
            document.getElementById("loadingList").classList.add("hidden");
            if (data.success) {
                localStorage.setItem("hike_admin_pass", pass);
                tuttiITour = data.tours;
                document.getElementById("sectionLogin").classList.add("hidden");
                document.getElementById("sectionDashboard").classList.remove("hidden");
                filtraI_Tour();
            }
        });
    }

    function filtraI_Tour() {
        const qNome = document.getElementById("searchNome").value.toLowerCase();
        const cont = document.getElementById("listaContenitore"); cont.innerHTML = "";
        
        const filtrati = tuttiITour.filter(t => t.nome.toLowerCase().includes(qNome));
        filtrati.forEach(t => {
            const item = document.createElement("div"); item.className = "tour-item";
            item.onclick = () => apriModificaTour(t);
            item.innerHTML = `<div class="title">${t.nome}</div><div class="info">📅 <strong>${t.data}</strong> | Disp: ${t.disponibili}/${t.totali}</div>`;
            cont.appendChild(item);
        });
    }

    function apriModificaTour(tour) {
        tourSelezionato = { ...tour }; 
        document.getElementById("editNomeTour").innerText = tourSelezionato.nome;
        document.getElementById("editDettagli").innerHTML = `Data: <strong>${tourSelezionato.data}</strong><br>Disponibili: <strong>${tourSelezionato.disponibili}</strong> (su ${tourSelezionato.totali})`;
        document.getElementById("nuovoNome").value = "";
        document.getElementById("chk-bici-propria").checked = false; 
        document.getElementById("displayNuoviPosti").innerText = "1";
        
        document.getElementById("sectionDashboard").classList.add("hidden");
        document.getElementById("sectionModifica").classList.remove("hidden");
        document.getElementById("listaPrenotatiContainer").classList.add("hidden");
    }

    function cambiaPostiNuovi(val) {
        let corr = (parseInt(document.getElementById("displayNuoviPosti").innerText)||0) + val;
        if(corr === 0) corr = val > 0 ? 1 : -1;
        document.getElementById("displayNuoviPosti").innerText = corr;
    }

    function salvaNuovaPrenotazione() {
        const n = document.getElementById("nuovoNome").value.trim();
        const t = document.getElementById("nuovoTelefono").value.trim();
        const b = parseInt(document.getElementById("displayNuoviPosti").innerText);
        const biciPropria = document.getElementById("chk-bici-propria").checked; // NUOVA LOGICA BICI PROPRIA
        
        if(!n) return alert("Nominativo obbligatorio!");
        if(!confirm(`Confermi ${b} posti per ${n}? ${biciPropria ? "(NON SCALA DISPONIBILITA')" : ""}`)) return;

        document.getElementById("btnSalvaPrenotazione").innerText = "Salvataggio...";
        
        fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({
            action: "add_manual_booking", 
            password: document.getElementById("password").value, 
            idTour: tourSelezionato.id, 
            nome: n, telefono: t, numBici: b, biciPropria: biciPropria
        })}).then(res => res.json()).then(d => { 
            document.getElementById("btnSalvaPrenotazione").innerText = "Salva Prenotazione";
            if(d.success){ mostraNotifica("✅ Prenotazione inserita!"); caricaTuttiITour(); }
        });
    }

    function tornaAllaLista() { document.getElementById("sectionModifica").classList.add("hidden"); document.getElementById("sectionDashboard").classList.remove("hidden"); }
    function disconnetti() { localStorage.removeItem("hike_admin_pass"); location.reload(); }

    function caricaListaPrenotati() {
        document.getElementById("listaPrenotatiContainer").classList.remove("hidden");
        const cont = document.getElementById("listaPrenotatiContent"); cont.innerHTML = "Caricamento...";
        
        fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({action: "get_prenotazioni", password: document.getElementById("password").value, idTour: tourSelezionato.id}) })
        .then(res => res.json()).then(data => {
            if(data.prenotazioni.length===0) return cont.innerHTML = "Nessuna prenotazione.";
            cont.innerHTML = "";
            data.prenotazioni.forEach(p => {
                const isPropria = p.richieste.includes("BICI PROPRIA"); // Rilevo bici propria
                const badgeExtra = isPropria ? `<span class="badge-bici" style="background:#fef08a; color:#854d0e;">Bici Proprie</span>` : "";
                
                let btnElimina = `<button style="background:#dc2626; color:white; padding:4px 8px; border-radius:6px; border:none; cursor:pointer;" onclick="eliminaPrenotazioneTour(${p.riga}, '${tourSelezionato.id}', ${p.num_bici}, ${isPropria})">🗑️ Elimina</button>`;
                
                const div = document.createElement("div"); div.className = "prenotazione-item";
                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between;">
                        <div>
                            <strong>👤 ${p.nominativo}</strong><br>
                            📞 ${p.telefono||'-'} <br>
                            🚲 Bici: <span class="badge-bici">${p.num_bici}</span> ${badgeExtra}
                        </div>
                        <div>${btnElimina}</div>
                    </div>
                `;
                cont.appendChild(div);
            });
        });
    }

    function eliminaPrenotazioneTour(riga, idTour, numBici, isPropria) {
        if(!confirm("Vuoi davvero eliminare questa prenotazione?")) return;
        fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({action: "elimina_prenotazione_tour", password: document.getElementById("password").value, riga: riga, idTour: idTour, numBici: numBici, isBiciPropria: isPropria}) })
        .then(res => res.json()).then(d => { if(d.success){ mostraNotifica("Prenotazione eliminata!"); caricaListaPrenotati(); caricaTuttiITour(); } });
    }

    // ==== GESTIONE TOUR PRIVATI ====
    function apriTourPrivati() {
        document.getElementById("sectionDashboard").classList.add("hidden");
        document.getElementById("sectionTourPrivati").classList.remove("hidden");
        caricaTourPrivati();
    }

    function tornaAiTourDaPrivati() {
        document.getElementById("sectionTourPrivati").classList.add("hidden");
        document.getElementById("sectionDashboard").classList.remove("hidden");
    }

    function salvaTourPrivato() {
        const nome = document.getElementById("priv-nome").value;
        const data = document.getElementById("priv-data").value;
        const bici = document.getElementById("priv-bici").value;
        const prezzo = document.getElementById("priv-prezzo").value;
        
        if(!nome || !data || !bici) return alert("Compila Nome, Data e Bici!");
        if(!confirm("Attenzione: salvando questo tour privato, le disponibilità verranno stornate su eventuali tour a calendario coincidenti con la stessa data. Procedo?")) return;

        fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "add_tour_privato", password: document.getElementById("password").value, nome, dataTour: data, numBici: bici, prezzo }) })
        .then(r=>r.json()).then(d=>{
            if(d.success){
                mostraNotifica("Tour privato creato!");
                document.getElementById("priv-nome").value = "";
                document.getElementById("priv-prezzo").value = "";
                caricaTourPrivati();
                caricaTuttiITour(); // Aggiorno il tabellone globale in backrgound
            } else {
                mostraNotifica(d.error || "Errore. (Hai creato il foglio 'Tour_Privati'?)", "error");
            }
        });
    }

    function caricaTourPrivati() {
        const cont = document.getElementById("lista-tour-privati"); cont.innerHTML = "Caricamento...";
        fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({action: "get_tour_privati", password: document.getElementById("password").value}) })
        .then(r=>r.json()).then(d=>{
            if(!d.success) return cont.innerHTML = "<div style='color:red;'>Errore: " + (d.error || "") + "</div>";
            cont.innerHTML = "";
            d.privati.forEach(p => {
                let statusBonifico = p.bonifico === "SI" 
                    ? `<div style="color:green; font-weight:bold; font-size:12px; margin-top:5px;">✅ Bonifico ok (Data: ${p.dataBonifico}) <button style="padding:2px 4px; font-size:10px;" onclick="gestisciBonifico(${p.riga}, 'NO', '')">Annulla</button></div>`
                    : `<div style="margin-top:8px;"><input type="date" id="bonifico-data-${p.riga}" style="padding:4px; font-size:12px; display:inline; width:auto;"> 
                       <button style="background:#10b981; color:white; padding:4px 8px; border:none; border-radius:4px; cursor:pointer;" onclick="gestisciBonifico(${p.riga}, 'SI', document.getElementById('bonifico-data-${p.riga}').value)">Segna Bonifico Pagato</button></div>`;

                const div = document.createElement("div"); div.className = "prenotazione-item";
                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:start;">
                        <div>
                            <strong style="font-size:16px;">👤 ${p.nome}</strong><br>
                            📅 Data Tour: <strong>${p.dataTour}</strong><br>
                            🚲 Bici: <span class="badge-bici">${p.numBici}</span> | 💰 Prezzo: €${p.prezzo||0}
                        </div>
                        <button style="background:#dc2626; color:white; padding:6px; border:none; border-radius:6px;" onclick="eliminaPrivato(${p.riga})">Elimina</button>
                    </div>
                    <div style="font-size:11px; margin-top:5px; color:#b45309; background:#fef3c7; padding:4px;">Stornati sui Tour di Calendario ID: ${p.tourStornati || 'Nessuno'}</div>
                    ${statusBonifico}
                `;
                cont.appendChild(div);
            });
        });
    }

    function gestisciBonifico(riga, status, dt) {
        if(status === "SI" && !dt) return alert("Inserisci la data del bonifico!");
        fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({action: "update_bonifico_privato", password: document.getElementById("password").value, riga, bonifico: status, dataBonifico: dt}) })
        .then(r=>r.json()).then(d=>{ if(d.success) caricaTourPrivati(); });
    }

    function eliminaPrivato(riga) {
        if(!confirm("Vuoi davvero eliminare questo tour privato? I posti stornati verranno re-immessi nei tour di calendario.")) return;
        fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({action: "elimina_tour_privato", password: document.getElementById("password").value, riga}) })
        .then(r=>r.json()).then(d=>{ if(d.success) caricaTourPrivati(); caricaTuttiITour(); });
    }
</script>
</body>
</html>
