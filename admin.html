<!DOCTYPE html>
<html lang="it">
<head><meta charset="UTF-8"><title>Hike Exp - Admin</title>
<style>
    :root { --primary: #2ecc71; --primary-dark: #27ae60; --dark: #2c3e50; }
    body { font-family: sans-serif; padding: 20px; background: #f1f5f9; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; }
    .tour-item { padding: 15px; border: 1px solid #ddd; margin-bottom: 10px; border-radius: 8px; }
    .badge-bici { background: #e0f2fe; color: #0369a1; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    .btn-wa { background: #25D366; color: white; padding: 8px; border: none; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 5px; }
    .hidden { display: none; }
</style>
</head>
<body>
<div class="container" id="app">
    <!-- Logica di visualizzazione Tour -->
    <div id="listaContenitore"></div>
</div>

<script>
    const SCRIPT_URL = "INSERISCI_QUI_IL_TUO_URL_SCRIPT";

    function caricaTuttiITour() {
        fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "get_all_tours", password: "LA_TUA_PASSWORD" }) })
        .then(res => res.json())
        .then(data => {
            const cont = document.getElementById("listaContenitore");
            cont.innerHTML = "";
            data.tours.forEach(t => {
                const item = document.createElement("div");
                item.className = "tour-item";
                item.innerHTML = `
                    <h3>${t.nome} - 📅 ${t.data}</h3>
                    <div style="background:#f8fafc; padding:10px; margin:10px 0;">
                        <p>Sito: ${t.occupati_sito} | Noleggi: ${t.noleggi} | Bici Proprie: <strong>${t.bici_proprie}</strong></p>
                        <p style="color:#0369a1; font-weight:bold;">👥 Prenotati Totali: ${t.prenotati_tour}</p>
                    </div>
                    <span style="background:${t.disponibili > 0 ? '#dcfce7':'#fee2e2'}">Disponibili: ${t.disponibili}</span>
                `;
                cont.appendChild(item);
            });
        });
    }

    // Per i Tour Privati - Formattazione pulita
    function formattaData(iso) {
        if(!iso) return "";
        let d = new Date(iso);
        return d.toLocaleDateString("it-IT");
    }

    // Tasto WhatsApp in Tour Privati
    function getBtnWA(nome, tel, info) {
        let waPhone = tel ? String(tel).replace(/[^0-9]/g, '') : "";
        if (waPhone && !waPhone.startsWith('39')) waPhone = '39' + waPhone;
        let text = encodeURIComponent(`Ciao ${nome}, ${info}`);
        return waPhone ? `<button class="btn-wa" onclick="window.open('https://wa.me/${waPhone}?text=${text}')">💬 WhatsApp</button>` : "";
    }
</script>
</body>
</html>
